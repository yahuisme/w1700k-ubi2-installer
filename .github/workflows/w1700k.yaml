name: W1700k UBI Installer (ARM) w custom payload

permissions:
  contents: read

concurrency:
  group: w1700k-installer-release
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    # Sunday 00:00 Hong Kong time (UTC+8)
    - cron: '0 16 * * 6'

env:
  REMOTE_REPOSITORY: w1700k/installer-repo
  REMOTE_BRANCH: w1700k
  TARGET_SUBTARGET: airoha/an7581
  INNER_CONFIG: configs/w1700k.config
  OUTER_CONFIG: configs/minimal.config
  RECOVERY_IMAGE: openwrt-airoha-an7581-gemtek_w1700k-ubi-initramfs-recovery.itb
  SYSUPGRADE_IMAGE: openwrt-airoha-an7581-gemtek_w1700k-ubi-squashfs-sysupgrade.itb
  INSTALLER_IMAGE: openwrt-airoha-an7581-gemtek_w1700k-ubi-initramfs-installer.itb
  UBOOT_IMAGE: openwrt-airoha-an7581-gemtek_w1700k-ubi-chainload-uboot.itb

jobs:
  build:
    name: Build OpenWrt installer images
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout installer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: installer-repo

      - name: Fetch latest OpenWrt payload
        id: payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 installer-repo/scripts/fetch-firmware.py installer-repo/files/installer

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk \
            gcc gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl

      - name: Checkout OpenWrt repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.REMOTE_REPOSITORY }}
          ref: ${{ env.REMOTE_BRANCH }}
          path: openwrt
          fetch-depth: 0

      - name: Record OpenWrt source revision
        id: source_meta
        run: |
          remote_sha="$(git -C openwrt rev-parse HEAD)"
          echo "REMOTE_SHA=$remote_sha" >> "$GITHUB_ENV"
          echo "remote_sha=$remote_sha" >> "$GITHUB_OUTPUT"

      - name: Use GitHub feeds
        run: |
          cd openwrt
          sed -i \
            -e 's#https://git.openwrt.org/feed/#https://github.com/openwrt/#g' \
            -e 's#https://git.openwrt.org/project/#https://github.com/openwrt/#g' \
            feeds.conf.default

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare config (inner build)
        run: |
          cd openwrt
          cp "../installer-repo/${{ env.INNER_CONFIG }}" .config
          make defconfig

      - name: Build OpenWrt images (inner build)
        run: |
          cd openwrt
          make -j"$(nproc)" download world

      - name: Stage installer assets and add installer files (outer build only)
        run: |
          cd openwrt
          mkdir -p files/installer
          cp "bin/targets/${{ env.TARGET_SUBTARGET }}/${{ env.RECOVERY_IMAGE }}" "files/installer/"
          rsync -a ../installer-repo/files/ files/
          chmod +x \
            files/installer/install.sh \
            files/lib/preinit/00_installer
          cmp "../installer-repo/files/installer/$SYSUPGRADE_IMAGE" "files/installer/$SYSUPGRADE_IMAGE"
          test -s "files/installer/$RECOVERY_IMAGE"
          # Reject an invalid board image before packaging the installer.
          staging_dir/host/bin/fwtool -i payload.json "files/installer/$SYSUPGRADE_IMAGE"
          python3 -c 'import json; m=json.load(open("payload.json")); assert "gemtek,w1700k-ubi" in m.get("new_supported_devices", m.get("supported_devices", [])); assert str(m.get("compat_version")) == "2.0"; assert m["version"]["target"] == "airoha/an7581"; assert m["version"]["board"] == "gemtek_w1700k-ubi"'

      - name: Prepare config (outer build)
        run: |
          cd openwrt
          cp "../installer-repo/${{ env.OUTER_CONFIG }}" .config
          make defconfig

      - name: Rebuild images with installer payload (outer build)
        run: |
          cd openwrt
          make -j"$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p output/installer
          cp "openwrt/bin/targets/${{ env.TARGET_SUBTARGET }}/${{ env.RECOVERY_IMAGE }}" "output/installer/${{ env.INSTALLER_IMAGE }}"
          cp "openwrt/bin/targets/${{ env.TARGET_SUBTARGET }}/${{ env.UBOOT_IMAGE }}" "output/installer/"
          test -s "output/installer/${{ env.INSTALLER_IMAGE }}"
          test -s "output/installer/${{ env.UBOOT_IMAGE }}"

      - name: Set release name
        id: release_meta
        run: echo "release_name=$(date -u +'%Y.%m.%d') - Installer for W1700K v2.0" >> "$GITHUB_OUTPUT"

      - name: Create new GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          target_commitish: ${{ github.sha }}
          tag_name: ubi2-installer-${{ github.run_number }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body: |
            # W1700K UBI2 U-Boot Chainloader + OpenWrt Installer

            **刷写设备前，请务必仔细阅读[安装说明](https://github.com/yahuisme/w1700k-ubi2-installer/blob/main/README.md)。**

            本项目基于 [hurrian 的 ubi-installer](https://github.com/hurrian/w1700k-ubi-installer)，内置 [w1700k-openwrt](https://github.com/yahuisme/w1700k-openwrt/releases) 构建启动时的最新标准版固件。

            - 固件版本：`${{ steps.payload.outputs.tag }}`
            - 固件 SHA-256：`${{ steps.payload.outputs.sha256 }}`
            - OpenWrt 源码提交：`${{ env.REMOTE_SHA }}`
          files: |
            output/installer/${{ env.INSTALLER_IMAGE }}
            output/installer/${{ env.UBOOT_IMAGE }}
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Remove previous installer releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Confirm publication and uploaded bytes before deleting older releases.
          python3 installer-repo/scripts/verify-release.py output/installer
          python3 installer-repo/scripts/cleanup-releases.py
